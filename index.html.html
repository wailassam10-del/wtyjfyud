<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question ❤️</title>
<style>
  body {
    background-color: #ffe6f2;
    font-family: 'Arial', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  h1 {
    color: #ff3385;
    font-size: 30px;
  }
  button {
    font-size: 20px;
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
  }
  #yes {
    background-color: #ff4da6;
    color: white;
  }
  #no {
    background-color: #aaa;
    color: white;
    position: absolute;
  }
</style>
</head>
<body>
  <h1>Do you wanna be my girlfriend? ♡ </h1>
  <button id="yes" onclick="yes()">Yes:) </button>
  <button id="no" onmouseover="moveNo()" ontouchstart="moveNo()">No </button>
  </div>
  <script>
    function yes() {
      document.body.innerHTML = `
        <h1 style='color:#ff3399'>Mwah˘³˘ I knew it!!! </h1>
        <iframe width="560" height="315" 
          src="https://www.youtube.com/embed/8ScAnaU0FFE?autoplay=1" 
          frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>
      `;
    }

    function moveNo() {
      const no = document.getElementById('no');
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      no.style.left = x + 'px';
      no.style.top = y + 'px';
    }
  </script>
</body>
</html>
